version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: UnifiDocumenter-Qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - unifi-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  unifi-documenter:
    # Use pre-built image (recommended)
    image: ghcr.io/loryanstrant/unifi-documenter:latest
    
    # OR build locally (comment out 'image' line above and uncomment below)
    # build: .
    
    container_name: unifi-documenter
    restart: unless-stopped
    depends_on:
      - qdrant
    
    # Resource limits to prevent system overload
    deploy:
      resources:
        limits:
          cpus: '2.0'          # Maximum 2 CPU cores
          memory: 2G           # Maximum 2GB RAM
        reservations:
          cpus: '0.5'          # Reserve at least 0.5 CPU cores
          memory: 512M         # Reserve at least 512MB RAM
    
    # Additional resource controls
    mem_swappiness: 0            # Disable swap to prevent disk thrashing
    oom_kill_disable: false      # Allow OOM killer if needed (safety)
    pids_limit: 200              # Limit number of processes
    
    environment:
      # Schedule Configuration
      - SCHEDULE_FREQUENCY=daily  # daily, weekly, monthly
      - SCHEDULE_TIME=02:00       # HH:MM format (24-hour)
      - SCHEDULE_DAY=1            # For weekly (1=Monday, 7=Sunday), for monthly (1-31)
      - TIMEZONE=UTC              # Timezone for scheduling
      
      # UDM Configuration
      - UDM_IP=192.168.1.1
      - UDM_ROOT_PASSWORD=your_password_here
      - REMOTE_BACKUP_DIR=/usr/lib/unifi/data/backup/autobackup
      
      # AI Configuration
      - AI_PROVIDER=openai        # openai, ollama, azure-openai, custom
      - AI_API_URL=https://api.openai.com/v1
      - AI_API_KEY=your_openai_api_key_here
      - AI_MODEL=gpt-4o-mini
      - AI_CONTEXT_WINDOW=128000  # Total tokens the model supports (e.g. 4096 for small models)
      - AI_MAX_TOKENS=4000        # Max tokens for AI output (must be < AI_CONTEXT_WINDOW)
      
      # Embedding Configuration
      - EMBEDDING_ENABLED=true
      - EMBEDDING_PROVIDER=ollama  # ollama, openai, custom
      - EMBEDDING_MODEL=nomic-embed-text
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_COLLECTION=unifi_configs
      - EMBEDDING_TOP_K=5
      
      # Optional Ollama Configuration (if AI_PROVIDER=ollama or EMBEDDING_PROVIDER=ollama)
      # - OLLAMA_URL=http://host.docker.internal:11434
      # - OLLAMA_MODEL=llama3
      
      # Optional Azure OpenAI Configuration (if AI_PROVIDER=azure-openai)
      # - AZURE_OPENAI_ENDPOINT=https://your-resource.openai.azure.com/
      # - AZURE_OPENAI_API_VERSION=2024-02-01
      # - AZURE_OPENAI_DEPLOYMENT=your-deployment-name
      
      # Output Configuration
      - OUTPUT_FORMAT=markdown    # markdown, json, both
      - MAX_DOCUMENT_SIZE=50000   # Maximum characters per document chunk
      - INCLUDE_RAW_DATA=false    # Include raw JSON in output
      
    volumes:
      - ./output:/app/output
      - ./config:/app/config:ro
    networks:
      - unifi-net

volumes:
  qdrant_data:

networks:
  unifi-net:
    driver: bridge
